<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>部隊シミュレーター</title>
<link rel="stylesheet" href="css/sim.css">
</head>
<body>
<section id="gate" class="gate">
  <form id="gateForm" class="gate-box" autocomplete="off">
    <h1>部隊シミュレーター</h1>
    <p class="small">合言葉を入れてください</p>
    <input id="gatePass" type="password" aria-label="合言葉">
    <label class="small"><input type="checkbox" id="gateRemember" checked> この端末で覚えておく</label>
    <button type="submit" class="primary">開く</button>
    <p id="gateMsg" class="gate-msg" aria-live="polite"></p>
  </form>
</section>

<div id="app" hidden>
<header class="top">
  <h1>部隊シミュレーター</h1>
  <button type="button" id="themeBtn" class="ghost" aria-label="夜/昼の切り替え">🌙</button>
</header>

<main>
  <div class="teams">
  <section class="team" id="teamA" data-side="A">
    <div class="team-head">
      <h2 class="side-title side-a">攻撃側</h2>
      <div class="team-tools">
        <select class="preset" aria-label="部隊を読み込む"></select>
        <button type="button" class="ghost team-save">保存</button>
        <button type="button" class="ghost team-del">削除</button>
      </div>
    </div>
    <div class="team-sum"></div>
    <div class="formation"></div>
  </section>

  <section class="team" id="teamD" data-side="D">
    <div class="team-head">
      <h2 class="side-title side-d">防御側</h2>
      <div class="team-tools">
        <select class="preset" aria-label="部隊を読み込む"></select>
        <button type="button" class="ghost team-save">保存</button>
        <button type="button" class="ghost team-del">削除</button>
      </div>
    </div>
    <div class="team-sum"></div>
    <div class="formation"></div>
  </section>

  </div>

  <section class="settings">
    <label>回数
      <select id="repeat">
        <option value="10">10回</option>
        <option value="30" selected>30回</option>
        <option value="100">100回</option>
      </select>
    </label>
    <p class="small">武将カードを押すと、レベル・赤・兵力・配分を変えられます</p>
  </section>

  <button type="button" id="runBtn" class="primary">戦わせる</button>
  <div id="status" class="status" aria-live="polite"></div>
  <progress id="progress" class="progress" max="1" value="0" hidden></progress>

  <section id="result" class="result battle-view" hidden>
    <div class="bv-wrap">
      <div class="bv-side bv-a" data-side="A"></div>
      <div class="bv-center">
        <div class="bv-outcome"></div>
        <div class="bv-summary">
          <span class="bv-sum-title">【<span class="bv-total"></span>戦の結果】</span>
          <span class="bv-rates"></span>
          <div class="bv-pick">
            <button type="button" class="bv-prev" aria-label="前の戦闘">◀</button>
            <span class="bv-index"></span>
            <button type="button" class="bv-next" aria-label="次の戦闘">▶</button>
          </div>
        </div>
      </div>
      <div class="bv-side bv-d" data-side="D"></div>
    </div>
    <div class="bv-slider">
      <label for="turnSlider" class="bv-slider-head"><span>表示するターン</span><span class="bv-turn"></span></label>
      <input type="range" id="turnSlider" min="0" max="1" value="1">
      <div class="bv-ticks"></div>
    </div>
    <div class="bv-actions">
      <button type="button" class="bv-btn" id="statsBtn">統計</button>
      <button type="button" class="bv-btn" id="turnLogBtn">このターンの戦報</button>
    </div>
    <ul class="warnings"></ul>
  </section>

  <section id="stats" class="stats-view" hidden>
    <div class="sv-tabs" role="tablist">
      <button type="button" class="sv-tab on" data-tab="hero" role="tab">武将統計</button>
      <button type="button" class="sv-tab" data-tab="skill" role="tab">戦法統計</button>
      <span class="sv-note"></span>
    </div>
    <div class="sv-body"></div>
  </section>

  <section id="log" class="log" hidden>
    <div class="log-head">
      <h2 class="log-title">戦報（1戦目）</h2>
      <label class="small"><input type="checkbox" id="detailToggle"> 細かい効果も表示</label>
    </div>
    <div class="log-body"></div>
  </section>

  <p class="footnote">戦闘計算は stzb_watcher の戦闘エンジン（2026-07時点のデータ）を元にしています。宝物・词条・高級兵種はまだ反映していません。⚠＝発動条件の一部が未再現、✕＝データが無く使えない戦法。</p>
</main>

<dialog id="picker" class="picker">
  <form method="dialog" class="picker-box">
    <div class="picker-head">
      <h2 id="pickerTitle">選択</h2>
      <button type="submit" class="ghost" value="cancel" aria-label="閉じる">✕</button>
    </div>
    <input id="pickerSearch" type="search" placeholder="名前で検索（日本語・中国語）" autocomplete="off">
    <div class="picker-filters" id="pickerFilters"></div>
    <ul id="pickerList" class="picker-list"></ul>
  </form>
</dialog>
</div>

<script type="module" src="js/loader.js"></script>
</body>
</html>
