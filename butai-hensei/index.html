<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>率土之滨 2026夏版 Tier表 & 5部隊編成ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202b; --ink2:#20303f; --paper:#f2ede2; --card:#fbf9f3; --card2:#f6f1e6;
  --line:#ddd3c0; --line2:#c9bfa9; --text:#1d2733; --muted:#6f7887; --seal:#b3272d; --seal-d:#8f1f24;
  --t0:#c0392b; --t0m:#cf7a34; --t1:#2f6fb0; --t2:#4f8f4a;
  --ok:#2f7d4f; --warn:#c0392b;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 18px rgba(20,30,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  color:var(--text); background:var(--paper);
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
.mincho{font-family:"Shippori Mincho",serif;}
a{color:inherit}

/* header */
header{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg,var(--ink),var(--ink2));
  color:#f4efe4; border-bottom:3px solid var(--seal);
}
.hwrap{max-width:1180px;margin:0 auto;padding:14px 130px 14px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.seal{
  flex:none;width:44px;height:44px;border:2px solid var(--seal);border-radius:7px;
  display:grid;place-items:center;color:#f4efe4;background:var(--seal);
  font-family:"Shippori Mincho",serif;font-weight:800;font-size:22px;line-height:1;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);
}
.brand h1{font-family:"Shippori Mincho",serif;font-weight:800;font-size:19px;margin:0;letter-spacing:.02em}
.brand .sub{font-size:11.5px;color:#b9c2ce;margin-top:2px;letter-spacing:.04em}
.tabs{display:flex;gap:6px;margin-left:auto;background:rgba(255,255,255,.06);padding:4px;border-radius:10px}
.tab{
  appearance:none;border:0;background:transparent;color:#cdd5df;
  font-family:inherit;font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:7px;cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tab:focus-visible{outline:2px solid #fff;outline-offset:2px}

main{max-width:1180px;margin:0 auto;padding:18px}
.view[hidden]{display:none}

/* controls */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line2);background:var(--card);color:var(--text);
  font-family:inherit;font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--ink);color:#f4efe4;border-color:var(--ink)}
.chip.t0[aria-pressed="true"]{background:var(--t0);border-color:var(--t0)}
.chip.t0m[aria-pressed="true"]{background:var(--t0m);border-color:var(--t0m)}
.chip.t1[aria-pressed="true"]{background:var(--t1);border-color:var(--t1)}
.chip.t2[aria-pressed="true"]{background:var(--t2);border-color:var(--t2)}
.search{
  flex:1;min-width:200px;max-width:340px;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:8px 12px;
}
.search input{border:0;background:transparent;font-family:inherit;font-size:14px;width:100%;outline:none;color:var(--text)}
.count{margin-left:auto;color:var(--muted);font-size:12.5px}

/* tier badge */
.tier{
  flex:none;font-family:"Shippori Mincho",serif;font-weight:800;color:#fff;
  border-radius:6px;padding:3px 9px;font-size:13px;letter-spacing:.03em;min-width:44px;text-align:center;
}
.tier.T0{background:var(--t0)} .tier.T0-{background:var(--t0m)}
.tier.T1{background:var(--t1)} .tier.T2-{background:var(--t2)}

/* tier tab nav */
.tiernav{
  position:sticky; top:var(--htop,70px); z-index:30;
  display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  padding:12px 0 10px; margin:-6px -2px 12px; background:var(--paper);
  border-bottom:1px solid var(--line);
}
.tiernav::-webkit-scrollbar{height:0}
.tnav{
  flex:none; border:1px solid var(--line2); background:var(--card); color:var(--text);
  font-family:"Shippori Mincho",serif; font-weight:800; font-size:13.5px;
  padding:7px 14px; border-radius:9px; cursor:pointer; display:flex; align-items:center; gap:7px;
}
.tnav .tn-count{
  font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700; font-size:11px;
  color:var(--muted); background:#ece4d3; border-radius:999px; padding:1px 8px; line-height:1.6;
}
.tnav[aria-selected="true"]{color:#fff}
.tnav.T0[aria-selected="true"]{background:var(--t0);border-color:var(--t0)}
.tnav.T0-[aria-selected="true"]{background:var(--t0m);border-color:var(--t0m)}
.tnav.T1[aria-selected="true"]{background:var(--t1);border-color:var(--t1)}
.tnav.T2-[aria-selected="true"]{background:var(--t2);border-color:var(--t2)}
.tnav.ALL[aria-selected="true"]{background:var(--ink);border-color:var(--ink)}
.tnav[aria-selected="true"] .tn-count{background:rgba(255,255,255,.24);color:#fff}
.tnav.dim{opacity:.5}

/* team grid (tier view) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.tcard .head{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--card2);border-bottom:1px solid var(--line)}
.tcard .score{font-family:"Shippori Mincho",serif;font-weight:700;color:var(--muted);font-size:13px}
.tcard .name{font-family:"Shippori Mincho",serif;font-weight:800;font-size:15.5px;margin-right:auto;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tcard .name .jp{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;font-size:11px;color:var(--muted)}
.addbtn{
  flex:none;appearance:none;border:1px solid var(--seal);color:var(--seal);background:transparent;
  font-family:inherit;font-weight:700;font-size:11.5px;padding:5px 9px;border-radius:7px;cursor:pointer;white-space:nowrap;
}
.addbtn:hover{background:var(--seal);color:#fff}
table.mem{width:100%;border-collapse:collapse;font-size:12.5px}
table.mem th,table.mem td{padding:6px 9px;border-bottom:1px dotted var(--line2);text-align:left;vertical-align:top}
table.mem th{font-weight:700;color:var(--muted);font-size:11px;background:#faf6ec}
table.mem .g{font-weight:700}
.slash{color:var(--seal);font-weight:700;padding:0 2px}
.note{padding:9px 13px;font-size:11.5px;color:var(--muted);background:#faf6ec;border-top:1px solid var(--line)}

/* board */
.savemenu{position:fixed;z-index:70;display:flex;gap:6px;flex-direction:column;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:6px;box-shadow:var(--shadow)}
.savemenu[hidden]{display:none}
.savemenu .btn{background:transparent;font-size:12.5px;padding:7px 12px;text-align:left}
/* offscreen render canvas */
#shareCanvas{position:fixed;left:-99999px;top:0}
.seg{display:flex;background:var(--card);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;font-family:inherit;font-weight:700;font-size:12px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#f4efe4}
.btn{
  appearance:none;font-family:inherit;font-weight:700;font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line2);background:var(--card);color:var(--text)
}
.btn.primary{background:var(--seal);border-color:var(--seal);color:#fff}
.btn:hover{filter:brightness(.97)}
.btn:focus-visible,.tab:focus-visible,select:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

.summary{
  position:sticky;top:var(--htop,74px);z-index:20;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;
  background:var(--ink);color:#eef2f7;border-radius:10px;padding:8px 12px;margin-bottom:14px;box-shadow:var(--shadow)
}
.sum-info{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.summary b{font-family:"Shippori Mincho",serif;font-size:13px}
.summary .pill{font-size:11.5px;background:rgba(255,255,255,.08);padding:3px 9px;border-radius:999px}
.summary .pill.bad{background:var(--seal)}
.summary .pill.good{background:#2f7d4f}
.sum-actions{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{appearance:none;font-family:inherit;font-weight:700;font-size:11.5px;padding:5px 10px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.10);color:#f4efe4;white-space:nowrap}
.sbtn:hover{background:rgba(255,255,255,.18)}

.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.panel .ph{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--card2);border-bottom:1px solid var(--line)}
.panel .pno{font-family:"Shippori Mincho",serif;font-weight:800;font-size:14px}
.panel .match{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}
.panel .match b{color:var(--text);font-family:inherit;font-weight:700}
.teamsel{width:100%;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff}
.teamsel select{width:100%}
select{
  font-family:inherit;font-size:12.5px;color:var(--text);background:#fff;
  border:1px solid var(--line2);border-radius:7px;padding:6px 8px;max-width:100%;
}
select.dup{border-color:var(--warn);background:#fdecec;color:var(--warn);font-weight:700}
.mrow{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:9px 12px;border-bottom:1px dotted var(--line2)}
.mrow:last-child{border-bottom:0}
.mpos{font-size:11px;color:var(--muted);font-weight:700;padding-top:7px}
.mbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.gname{font-weight:700;font-size:13.5px}
.gname.dup{color:var(--warn)}
.gsel{width:100%}
.tacs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tacwrap{display:flex;flex-direction:column;gap:2px;min-width:0}
.taclab{font-size:10px;color:var(--muted)}
.tacs select{width:100%}
.tac-more{margin-top:3px;appearance:none;border:0;background:transparent;color:var(--seal-d);font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;padding:1px 0;text-align:left}
.tac-more:hover{text-decoration:underline}
.tre{font-size:10.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:12.5px;padding:14px 12px;text-align:center}
.reco{font-size:10.5px;color:var(--seal-d)}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#f4efe4;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:80;border-left:3px solid var(--seal)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{max-width:1180px;margin:8px auto 30px;padding:0 18px;color:var(--muted);font-size:11px}
@media (max-width:640px){
  .brand h1{font-size:16px}.tabs{margin-left:0;width:100%}.tab{flex:1}
  .summary{top:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== dark mode ===== */
body.dark{
  --ink:#0e1620; --ink2:#16222f; --paper:#141b22; --card:#1c2632; --card2:#212d3a;
  --line:#2c3947; --line2:#3a4a5a; --text:#e7ecf1; --muted:#94a0ad; --seal:#e0555b; --seal-d:#f0888c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
}
body.dark .tnav .tn-count{background:#2a3644;color:#aab4c0}
body.dark table.mem th{background:#26313e}
body.dark .note{background:#1a232e}
body.dark .search input{color:var(--text)}
body.dark select{background:#141b22;color:var(--text)}
body.dark .tcard .head, body.dark .panel .ph{background:var(--card2)}
/* dark: header tabs & board mode/segment text stay readable */
body.dark .tab{color:#aeb8c4}
body.dark .tab[aria-selected="true"]{background:#2a3644;color:#fff}
body.dark .seg button{color:#aeb8c4}
body.dark .seg button[aria-pressed="true"]{background:#33404f;color:#fff}
body.dark .tnav{background:var(--paper)}
body.dark .tnav.ALL[aria-selected="true"]{background:#33404f;border-color:#33404f}
body.dark .summary{background:#0b1119}

/* ===== theme toggle switch (fixed top-right) ===== */
.theme-toggle{
  position:fixed; top:14px; right:16px; z-index:60;
  display:inline-flex; align-items:center; gap:8px; cursor:pointer;
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.22);
  padding:6px 10px 6px 12px; border-radius:999px; user-select:none;
}
.theme-toggle .tlabel{font-size:12px;font-weight:700;color:#f4efe4;line-height:1}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch .track{position:absolute;inset:0;background:#c9bfa9;border-radius:999px;transition:.2s}
.switch .thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.2s;display:grid;place-items:center;font-size:11px}
.switch input:checked + .track{background:#3a4a5a}
.switch input:checked + .track + .thumb{transform:translateX(20px)}
.theme-toggle:focus-within{outline:2px solid var(--seal);outline-offset:2px}

/* ===== matchup tags ===== */
.tags{display:flex;flex-wrap:wrap;gap:5px;padding:8px 13px 2px}
.tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;line-height:1.5;border:1px solid transparent}
.tag.s{background:rgba(79,143,74,.14);color:#3c7d3c;border-color:rgba(79,143,74,.3)}
.tag.w{background:rgba(192,57,43,.12);color:#c0392b;border-color:rgba(192,57,43,.3)}
body.dark .tag.s{background:rgba(120,190,110,.16);color:#93d68a}
body.dark .tag.w{background:rgba(224,85,91,.16);color:#f0888c}
.tag .k{opacity:.7;font-weight:500;margin-right:2px}

/* ===== ownership panel ===== */
.ownbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.own-toggle{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--text);
  background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;cursor:pointer}
.own-toggle input{width:16px;height:16px;accent-color:var(--seal)}
.own-open{appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--text);
  font-family:inherit;font-weight:700;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer}
.own-count{font-size:12px;color:var(--muted)}
.tcard.locked{opacity:.42;filter:saturate(.5)}
.tcard.locked .addbtn{display:none}
.miss{font-size:11px;color:var(--seal);font-weight:700;padding:2px 13px 8px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,20,.55);display:none;z-index:90;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal.open{display:flex}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;box-shadow:var(--shadow);overflow:hidden}
.sheet .sh{position:sticky;top:0;background:var(--ink);color:#f4efe4;padding:14px 18px;display:flex;align-items:center;gap:12px}
.sheet .sh h3{margin:0;font-family:"Shippori Mincho",serif;font-size:17px}
.sheet .sh .x{margin-left:auto;cursor:pointer;font-size:20px;border:0;background:transparent;color:#f4efe4}
.sheet .body{padding:14px 18px}
.own-search{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--card);color:var(--text);font-family:inherit;font-size:14px;margin-bottom:12px}
.own-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.own-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:13px}
.own-item input{width:15px;height:15px;accent-color:var(--seal)}
.own-item.on{border-color:var(--seal);background:rgba(179,39,45,.06)}
.own-actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
</style>
</head>
<body>
<label class="theme-toggle" title="昼／夜モード切替">
  <span class="tlabel" id="themeLabel">昼</span>
  <span class="switch"><input type="checkbox" id="themeSwitch" role="switch" aria-label="ダークモード切替"><span class="track"></span><span class="thumb" id="themeThumb">☀</span></span>
</label>
<header>
  <div class="hwrap">
    <div class="brand">
      <div class="seal mincho">碧</div>
      <div>
        <h1>率土之滨 部隊編成ボード</h1>
        <div class="sub">2026年 夏版（第3四半期）チーム強度Tier榜・100隊 ／ 日本語版</div>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-tier" role="tab" aria-selected="true" aria-controls="view-tier">Tier表</button>
      <button class="tab" id="tab-board" role="tab" aria-selected="false" aria-controls="view-board">5部隊編成</button>
    </div>
  </div>
</header>

<main>
  <!-- ===== Tier view ===== -->
  <section class="view" id="view-tier" role="tabpanel" aria-labelledby="tab-tier">
    <div class="ownbar">
      <label class="own-toggle"><input type="checkbox" id="ownFilter"> 所持武将で絞る</label>
      <button class="own-open" id="ownOpen">武将を設定</button>
      <span class="own-count" id="ownCount"></span>
    </div>
    <div class="tiernav" id="tierNav" role="tablist" aria-label="Tierで表示">
      <button class="tnav T0"  data-tier="T0"  role="tab" aria-selected="true">T0 <span class="tn-count"></span></button>
      <button class="tnav T0-" data-tier="T0-" role="tab" aria-selected="false">T0- <span class="tn-count"></span></button>
      <button class="tnav T1"  data-tier="T1"  role="tab" aria-selected="false">T1 <span class="tn-count"></span></button>
      <button class="tnav T2-" data-tier="T2-" role="tab" aria-selected="false">T2- <span class="tn-count"></span></button>
      <button class="tnav ALL" data-tier="ALL" role="tab" aria-selected="false">すべて <span class="tn-count"></span></button>
    </div>
    <div class="toolbar">
      <label class="search">
        <span aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="武将名・部隊名・戦法で検索（全Tier）" autocomplete="off">
      </label>
      <span class="count" id="tierCount"></span>
    </div>
    <div class="grid" id="tierGrid"></div>
  </section>

  <!-- ===== Board view ===== -->
  <section class="view" id="view-board" role="tabpanel" aria-labelledby="tab-board" hidden>
    <div class="modebar">
      <div class="seg" role="group" aria-label="編成モード">
        <button id="mode-team" aria-pressed="true">部隊で選ぶ</button>
        <button id="mode-gen" aria-pressed="false">武将で選ぶ（逆引き）</button>
      </div>
      <button class="btn" id="btnNarrow" title="空き枠を、まだ組める部隊だけに絞る（部隊モード）">空き枠を絞る</button>
      <button class="btn primary" id="btnAuto">戦法を自動割り当て</button>
      <button class="btn" id="btnReset">リセット</button>
    </div>
    <div class="savemenu" id="saveMenu" hidden>
      <button class="btn" data-fmt="png">PNG画像</button>
      <button class="btn" data-fmt="jpg">JPG画像</button>
      <button class="btn" data-fmt="pdf">PDF</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="boards" id="boards"></div>
  </section>
</main>
<div class="foot">データ：碧版 2026年 第3四半期 Tier榜（原作者 @老碧666）を日本語化。「/」は「どちらか一方（or）」の意味です。実際のゲーム内設定・バージョンにより数値は変動します。</div>
<div class="modal" id="ownModal" role="dialog" aria-modal="true" aria-label="所持武将の設定">
  <div class="sheet">

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,

, "count": 1, "bestTier": "T0-", "teams": ["変種・蜀歩"]}, {"tactic": "斂衆定気", "count": 1, "bestTier": "T2-", "teams": ["龐統・肉隊（耐久隊）"]}, {"tactic": "桃園結義", "count": 1, "bestTier": "T2-", "teams": ["久戦・蜀の知略隊"]}]}], "allTactics": ["一夫当関", "一騎当千", "万箭斉発", "三術奇謀", "三軍之衆", "三軍斉出", "不攻", "並進", "主命必達", "久戦熟謀", "乗勝追撃", "伐謀", "健卒不殆", "先声奪人", "先駆突撃", "全軍突撃", "兵無常勢", "兼弱攻昧", "利兵謀勝", "勝兵求戦", "勝敵益強", "勠力同心", "勢無虚動", "単騎救主", "及鋒而試", "反撃之策", "反計之策", "反間", "合縦連横", "合衆", "塁実迎撃", "大賞三軍", "奇正之勢", "奸悪皆滅", "妖術", "始計", "威震逍遥", "定軍山", "当陽橋", "形兵之極", "待ち伏せ", "愈戦愈勇", "懸権而動", "戦必断金", "撃勢", "攻其不備", "斂衆定気", "文伐", "望風而降", "桃園問津(守拙)", "桃園問津(息交)", "桃園結義", "梟雄", "正始之変", "歩歩為営", "汜水関", "河内世澤", "深謀遠慮", "渾水摸魚", "火焼連営", "無心恋戦", "疏数", "疾戦", "疾撃其後", "白刃", "百戦精兵", "知己知彼", "磐陣善守", "神兵天降", "空城", "絶水過敵", "美人計", "衆謀不懈", "衡軛", "襲屯奪気", "西陲立功(靖辺)", "計険遠近", "誘敵深入", "謀定後動", "追撃", "道行険阻", "避其鋒芒", "避鋭鼓舞", "重整旗鼓", "鋒矢", "長兵方陣", "閃撃", "風声鶴唳", "颯沓如星", "鳳儀亭", "鼎足江東"]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('tierdata').textContent);
const TEAMS = DATA.teams;
const GEN_INDEX = {}; DATA.generals.forEach(g=>GEN_INDEX[g.name]=g);
// 武将を「登場部隊数の多い順」に並べたリスト（同数なら名前順）
const GEN_SORTED = DATA.generals.slice().sort((a,b)=>
  (b.teams.length-a.teams.length) || String(a.name).localeCompare(String(b.name),'ja'));
const ALL_GEN_NAMES = DATA.generals.map(g=>g.name);

/* ---------- persistence (localStorage; falls back to memory in preview) ---------- */
const store={
  get(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){return (this._m&&this._m[k])??def;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){(this._m=this._m||{})[k]=v;}},
  _m:{}
};

/* ---------- theme ---------- */
function applyTheme(dark){
  document.body.classList.toggle('dark',dark);
  const sw=document.getElementById('themeSwitch'); if(sw)sw.checked=dark;
  const lb=document.getElementById('themeLabel'); if(lb)lb.textContent=dark?'夜':'昼';
  const th=document.getElementById('themeThumb'); if(th)th.textContent=dark?'🌙':'☀';
  store.set('stzb_dark',dark);
}
/* ---------- ownership ---------- */
let owned = new Set(store.get('stzb_owned', ALL_GEN_NAMES)); // 既定は全所持
let ownFilterOn = store.get('stzb_ownfilter', false);
function saveOwned(){store.set('stzb_owned',[...owned]);}
function ownsAll(gens){return gens.every(g=>owned.has(g));}
function missingOf(team){return team.members.map(m=>m.gen).filter(g=>!owned.has(g));}
function updOwnCount(){
  const s=`所持 ${owned.size}/${ALL_GEN_NAMES.length}`;
  const a=document.getElementById('ownCount');if(a)a.textContent=s;
  const b=document.getElementById('ownCount2');if(b)b.textContent=s;
}
const TIER_ORDER = DATA.meta.tierOrder;
const NUM = 5;

/* ---------- utilities ---------- */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* System of Distinct Representatives (bipartite matching) */
function sdrFeasible(slots){
  const m={};
  function go(i,seen){for(const t of slots[i]){if(!seen[t]){seen[t]=true;if(m[t]===undefined||go(m[t],seen)){m[t]=i;return true;}}}return false;}
  for(let i=0;i<slots.length;i++){if(!go(i,{}))return false;}
  return true;
}
function sdrAssign(slots){
  const m={};
  function go(i,seen){for(const t of slots[i]){if(!seen[t]){seen[t]=true;if(m[t]===undefined||go(m[t],seen)){m[t]=i;return true;}}}return false;}
  for(let i=0;i<slots.length;i++)go(i,{});
  const out=new Array(slots.length).fill(null);
  for(const t in m)out[m[t]]=t;
  return out;
}

/* general's merged tactic pool (t2+t3 combined), plus meta labels.
   pool = that general's recommended tactics (freq order).
   ALL = every tactic in the DB (for the 全戦法 expansion). */
const ALL_TACTICS = DATA.allTactics || [];
function repertoire(gen){
  const g=GEN_INDEX[gen]; const meta={};
  if(!g)return {pool:[],meta};
  const pool=(g.pool||[]).map(r=>{meta[r.tactic]=r.count+'回·'+r.bestTier;return r.tactic;});
  return {pool,meta};
}

/* ---------- Tier view ---------- */
let tierFilter='T0', query='';
function tierMatch(t,q){
  if(String(t.name).toLowerCase().includes(q))return true;
  if(t.name_zh&&String(t.name_zh).toLowerCase().includes(q))return true;
  return t.members.some(m=>
    String(m.gen).toLowerCase().includes(q) ||
    m.t2.some(x=>x.toLowerCase().includes(q)) ||
    m.t3.some(x=>x.toLowerCase().includes(q)));
}
function initTierCounts(){
  const counts={ALL:TEAMS.length};
  TIER_ORDER.forEach(t=>counts[t]=TEAMS.filter(x=>x.tier===t).length);
  document.querySelectorAll('#tierNav .tnav').forEach(b=>{
    const span=b.querySelector('.tn-count'); if(span)span.textContent=(counts[b.dataset.tier]||0);
  });
}
function renderTier(){
  const grid=document.getElementById('tierGrid');
  const q=query.trim().toLowerCase();
  const searching=q.length>0;
  let list=TEAMS.filter(t=>{
    if(searching)return tierMatch(t,q);
    return tierFilter==='ALL'||t.tier===tierFilter;
  });
  // 所持フィルタ（ON時は組めない部隊を除外）
  if(ownFilterOn) list=list.filter(t=>ownsAll(t.members.map(m=>m.gen)));
  document.querySelectorAll('#tierNav .tnav').forEach(b=>b.classList.toggle('dim',searching));
  document.getElementById('tierCount').textContent =
    searching ? ('「'+query.trim()+'」の検索結果：'+list.length+'件（全Tier）') : (list.length+' 部隊');
  grid.innerHTML='';
  const orderIdx=t=>TIER_ORDER.indexOf(t.tier);
  list.sort((a,b)=>orderIdx(a)-orderIdx(b)||(parseFloat(b.score||0)-parseFloat(a.score||0)));
  for(const t of list){
    const rows=t.members.map(m=>`<tr>
      <td>${esc(m.pos)}</td>
      <td class="g"${owned.has(m.gen)?'':' style="color:var(--seal)"'}>${esc(m.gen)}${owned.has(m.gen)?'':' ✱'}</td>
      <td>${joinSlash(m.t2)}</td>
      <td>${joinSlash(m.t3)}</td>
      <td>${esc(m.treasure)}</td>
      <td>${esc(m.ciTiao)}</td></tr>`).join('');
    const miss=missingOf(t);
    const locked = !ownFilterOn && miss.length>0; // フィルタOFF時は薄グレーで残す
    const tagChips=[
      ...(t.strongVs||[]).map(x=>`<span class="tag s"><span class="k">得意</span>${esc(x)}</span>`),
      ...(t.weakVs||[]).map(x=>`<span class="tag w"><span class="k">苦手</span>${esc(x)}</span>`)
    ].join('');
    grid.appendChild(el(`<article class="tcard${locked?' locked':''}">
      <div class="head">
        <span class="tier ${cls(t.tier)}">${esc(t.tier)}</span>
        <span class="score">${t.score?esc(t.score):''}</span>
        <span class="name mincho">${esc(t.name_zh||t.name)}${t.name_zh&&t.name&&t.name!==t.name_zh?`<span class="jp">（${esc(t.name)}）</span>`:''}</span>
        <button class="addbtn" data-add="${esc(t.name)}">＋ 編成へ</button>
      </div>
      ${tagChips?`<div class="tags">${tagChips}</div>`:''}
      ${(locked&&miss.length)?`<div class="miss">未所持：${miss.map(esc).join('・')}</div>`:''}
      <table class="mem"><thead><tr><th>位置</th><th>武将</th><th>第二戦法</th><th>第三戦法</th><th>宝物</th><th>词条</th></tr></thead>
      <tbody>${rows}</tbody></table>
      ${t.note?`<div class="note">${esc(t.note)}</div>`:''}
    </article>`));
  }
}
function joinSlash(arr){return (arr||[]).map(esc).join('<span class="slash">/</span>');}
function cls(tier){return tier.replace('-','-');} // T0- stays

/* ---------- Board model ---------- */
let mode='team'; // 'team' | 'gen'
// board[ti] = {name, members:[{gen,candT2,candT3,t2,t3,treasure,ciTiao}]}
let board=[];
function blankMember(){return {gen:'',candT2:[],candT3:[],pool:[],t2:'',t3:'',t2All:false,t3All:false,treasure:'',ciTiao:''};}
function blankTeam(){return {name:'',members:[blankMember(),blankMember(),blankMember()]};}
function initBoard(){board=[];for(let i=0;i<NUM;i++)board.push(blankTeam());}

function allMembers(){const a=[];board.forEach((t,ti)=>t.members.forEach((m,k)=>a.push({m,ti,k})));return a;}
function usedGenerals(exceptTi){const s={};board.forEach((t,ti)=>{if(ti===exceptTi)return;t.members.forEach(m=>{if(m.gen)s[m.gen]=(s[m.gen]||0)+1;});});return s;}
function usedGeneralsExceptSlot(ti,k){const s={};board.forEach((t,x)=>t.members.forEach((m,y)=>{if(x===ti&&y===k)return;if(m.gen)s[m.gen]=true;}));return s;}

/* dup detection over the whole board */
function dupSets(){
  const gc={},tc={};
  allMembers().forEach(({m})=>{
    if(m.gen)gc[m.gen]=(gc[m.gen]||0)+1;
    if(m.t2)tc[m.t2]=(tc[m.t2]||0)+1;
    if(m.t3)tc[m.t3]=(tc[m.t3]||0)+1;
  });
  const gd={},td={};
  for(const k in gc)if(gc[k]>1)gd[k]=true;
  for(const k in tc)if(tc[k]>1)td[k]=true;
  return {gd,td};
}

/* set a template team into slot ti (team mode) */
function setTeam(ti,name){
  if(!name){board[ti]=blankTeam();return;}
  const t=TEAMS.find(x=>x.name===name);
  if(!t){board[ti]=blankTeam();return;}
  board[ti].name=name;
  board[ti].members=t.members.map(m=>({
    gen:m.gen,candT2:m.t2.slice(),candT3:m.t3.slice(),
    t2:m.t2[0]||'',t3:m.t3[0]||'',treasure:m.treasure||'',ciTiao:m.ciTiao||''
  }));
}
/* set a general into slot (gen mode) — merged pool, order-free 第二/第三 */
function setGeneral(ti,k,gen){
  if(!gen){board[ti].members[k]=blankMember();board[ti].name=reverseName(ti);return;}
  const rep=repertoire(gen);
  const p=rep.pool;
  const t2=p[0]||'';
  const t3=p.find(x=>x!==t2)||''; // avoid picking the same tactic twice by default
  board[ti].members[k]={gen,candT2:[],candT3:[],pool:p,t2,t3,t2All:false,t3All:false,treasure:'',ciTiao:''};
  board[ti].name=reverseName(ti);
}
/* display name: Chinese primary + Japanese in parens */
function dispName(jpName){
  if(!jpName)return '';
  const t=TEAMS.find(x=>x.name===jpName);
  if(!t)return jpName;
  const zh=t.name_zh||t.name;
  return (zh!==t.name)?(zh+'（'+t.name+'）'):zh;
}
/* reverse lookup: which template matches this slot's 3 generals */
function reverseName(ti){
  const gens=board[ti].members.map(m=>m.gen).filter(Boolean);
  if(gens.length===0)return '';
  let best=null;
  for(const t of TEAMS){
    const tg=t.members.map(m=>m.gen);
    let inter=0;gens.forEach(g=>{if(tg.includes(g))inter++;});
    const full=(inter===3 && gens.length===3);
    if(!best||inter>best.inter){best={t,inter,full};}
  }
  if(!best||best.inter<2)return '';
  return (best.inter===3?'＝ ':'≒ ')+best.t.name+(best.inter<3?'（'+best.inter+'/3）':'');
}

/* team compatibility for narrowing (team mode) */
function teamCompatible(t,ti){
  const used=usedGenerals(ti);
  const gens=t.members.map(m=>m.gen);
  if(gens.some(g=>used[g]))return false;
  if(new Set(gens).size!==gens.length)return false;
  const slots=[];
  board.forEach((bt,x)=>{if(x===ti)return;bt.members.forEach(m=>{if(m.candT2.length)slots.push(m.candT2);if(m.candT3.length)slots.push(m.candT3);});});
  t.members.forEach(m=>{if(m.t2.length)slots.push(m.t2);if(m.t3.length)slots.push(m.t3);});
  return sdrFeasible(slots);
}

/* ---------- Board render ---------- */
function renderBoard(){
  const wrap=document.getElementById('boards');
  const {gd,td}=dupSets();
  wrap.innerHTML='';
  board.forEach((bt,ti)=>{
    const panel=el(`<section class="panel"></section>`);
    const matchTxt=bt.name?`<span class="match">逆引き <b>${esc(dispName(bt.name.replace(/^[＝≒]\s?/,'')))}</b>${/^[＝]/.test(bt.name)?'（一致）':''}</span>`:'';
    panel.appendChild(el(`<div class="ph"><span class="pno mincho">部隊 ${ti+1}</span>${mode==='gen'?matchTxt:(bt.name?`<span class="match"><b>${esc(dispName(bt.name))}</b></span>`:'')}</div>`));

    if(mode==='team'){
      // team selector (narrowed)
      const opts=['<option value="">― 部隊を選ぶ ―</option>'];
      TIER_ORDER.forEach(tr=>{
        const inTier=TEAMS.filter(t=>t.tier===tr && (t.name===bt.name || teamCompatible(t,ti)));
        if(!inTier.length)return;
        opts.push(`<optgroup label="${tr}">`);
        inTier.forEach(t=>{const disp=(t.name_zh||t.name)+(t.name_zh&&t.name&&t.name!==t.name_zh?'（'+t.name+'）':'');opts.push(`<option value="${esc(t.name)}"${t.name===bt.name?' selected':''}>${esc(disp)}${t.score?' ('+esc(t.score)+')':''}</option>`);});
        opts.push('</optgroup>');
      });
      const sel=el(`<div class="teamsel"><select aria-label="部隊${ti+1}を選ぶ">${opts.join('')}</select></div>`);
      sel.querySelector('select').addEventListener('change',e=>{setTeam(ti,e.target.value);renderBoard();});
      panel.appendChild(sel);
    }

    // member rows
    bt.members.forEach((m,k)=>{
      const row=el(`<div class="mrow"></div>`);
      row.appendChild(el(`<div class="mpos">${esc(m.pos||['本営','中衛','前衛'][k])}</div>`));
      const body=el(`<div class="mbody"></div>`);

      if(mode==='gen'){
        const usedSet=usedGeneralsExceptSlot(ti,k);
        const opts=['<option value="">― 武将を選ぶ ―</option>'];
        GEN_SORTED.forEach(g=>{
          if(usedSet[g.name] && g.name!==m.gen)return;
          if(ownFilterOn && !owned.has(g.name) && g.name!==m.gen)return;
          opts.push(`<option value="${esc(g.name)}"${g.name===m.gen?' selected':''}>${esc(g.name)}（${g.teams.length}部隊）</option>`);
        });
        const gsel=el(`<select class="gsel${gd[m.gen]?' dup':''}" aria-label="武将">${opts.join('')}</select>`);
        gsel.addEventListener('change',e=>{setGeneral(ti,k,e.target.value);renderBoard();});
        body.appendChild(gsel);
      }else{
        body.appendChild(el(`<div class="gname${gd[m.gen]?' dup':''}">${m.gen?esc(m.gen):'<span style="color:var(--muted)">―</span>'}</div>`));
      }

      // tactic selects
      const tac=el(`<div class="tacs"></div>`);
      tac.appendChild(tacticControl(ti,k,'t2',m,td));
      tac.appendChild(tacticControl(ti,k,'t3',m,td));
      body.appendChild(tac);

      if(m.treasure||m.ciTiao){
        body.appendChild(el(`<div class="tre">宝物 ${esc(m.treasure||'—')} ／ 词条 ${esc(m.ciTiao||'—')}</div>`));
      }
      row.appendChild(body);
      panel.appendChild(row);
    });

    wrap.appendChild(panel);
  });
  renderSummary();
  try{autosave();}catch(e){}
}

function tacticControl(ti,k,which,m,td){
  const val=m[which];
  const other=which==='t2'?m.t3:m.t2;
  const lab=which==='t2'?'第二戦法':'第三戦法';
  const w=el(`<div class="tacwrap"><span class="taclab">${lab}</span></div>`);
  if(!m.gen){w.appendChild(el(`<select disabled><option>—</option></select>`));return w;}

  if(mode==='team'){
    // 部隊モード：テンプレの「/」候補から
    const cands=which==='t2'?m.candT2:m.candT3;
    const opts=[]; if(cands.length===0)opts.push('<option value="">—</option>');
    cands.forEach(t=>opts.push(`<option value="${esc(t)}"${t===val?' selected':''}>${esc(t)}</option>`));
    const sel=el(`<select class="${td[val]?'dup':''}" aria-label="${lab}">${opts.join('')}</select>`);
    sel.addEventListener('change',e=>{board[ti].members[k][which]=e.target.value;renderBoard();});
    w.appendChild(sel);
    return w;
  }

  // 武将モード：合算プール（おすすめ）＋「全戦法」展開。第二/第三は入れ替え自由。
  const rep=repertoire(m.gen);
  const meta=rep.meta;
  const expanded = which==='t2'?m.t2All:m.t3All;
  const source = expanded ? ALL_TACTICS : rep.pool;
  const opts=[];
  opts.push(`<option value=""${val===''?' selected':''}>― 選択 ―</option>`);
  // おすすめ見出し（展開時のみラベル）
  source.forEach(t=>{
    if(t===other && t!==val) return;            // 同じ武将内で重複不可（他方が使用中は隠す）
    const label = meta[t] ? `${t}（${meta[t]}）` : t;
    opts.push(`<option value="${esc(t)}"${t===val?' selected':''}>${esc(label)}</option>`);
  });
  // 現在値が候補外（全戦法で選んだ後に絞りへ戻った等）でも表示できるよう補完
  if(val && !source.includes(val)){
    opts.splice(1,0,`<option value="${esc(val)}" selected>${esc(val)}</option>`);
  }
  const sel=el(`<select class="${td[val]?'dup':''}" aria-label="${lab}">${opts.join('')}</select>`);
  sel.addEventListener('change',e=>{board[ti].members[k][which]=e.target.value;renderBoard();});
  w.appendChild(sel);

  // 「全戦法から選ぶ / おすすめに戻す」トグル
  const toggle=el(`<button type="button" class="tac-more">${expanded?'◂ おすすめに戻す':'全戦法から選ぶ ▸'}</button>`);
  toggle.addEventListener('click',()=>{
    if(which==='t2')board[ti].members[k].t2All=!m.t2All; else board[ti].members[k].t3All=!m.t3All;
    renderBoard();
  });
  w.appendChild(toggle);
  return w;
}

function renderSummary(){
  const s=document.getElementById('summary');
  const filledTeams=board.filter(t=>t.members.some(m=>m.gen)).length;
  const gens=new Set();allMembers().forEach(({m})=>{if(m.gen)gens.add(m.gen);});
  const tacs=new Set();allMembers().forEach(({m})=>{if(m.t2)tacs.add(m.t2);if(m.t3)tacs.add(m.t3);});
  const {gd,td}=dupSets();
  const dupCount=Object.keys(gd).length+Object.keys(td).length;
  s.innerHTML=`
    <div class="sum-info">
      <b>編成状況</b>
      <span class="pill">部隊 ${filledTeams}/${NUM}</span>
      <span class="pill">武将 ${gens.size}</span>
      <span class="pill">戦法 ${tacs.size}</span>
      ${dupCount?`<span class="pill bad">重複 ${dupCount}</span>`:`<span class="pill good">重複なし ✓</span>`}
    </div>
    <div class="sum-actions">
      <button class="sbtn" data-act="save">画像を保存 ▾</button>
      <button class="sbtn" data-act="share">共有</button>
      <button class="sbtn" data-act="copy">コピー</button>
    </div>`;
}

/* ---------- actions ---------- */
function firstEmptySlot(){return board.findIndex(t=>!t.members.some(m=>m.gen));}
function addTeamToBoard(name){
  switchTab('board');
  if(mode!=='team'){setMode('team');}
  const t=TEAMS.find(x=>x.name===name);
  const idx=firstEmptySlot();
  if(idx<0){toast('空き枠がありません。リセットするか枠を空けてください。');return;}
  if(!teamCompatible(t,idx)){toast('「'+name+'」は現在の編成と武将/戦法が重複します。');return;}
  setTeam(idx,name);renderBoard();toast('部隊 '+(idx+1)+' に「'+name+'」を追加しました。');
}
function autoAssign(){
  const slots=[],refs=[];
  const uniq=(a)=>a.filter((x,i)=>x&&a.indexOf(x)===i);
  allMembers().forEach(({m,ti,k})=>{
    if(!m.gen)return;
    if(mode==='team'){
      if(m.candT2.length){slots.push(m.candT2);refs.push([ti,k,'t2']);}
      if(m.candT3.length){slots.push(m.candT3);refs.push([ti,k,'t3']);}
    }else{
      // 武将モード：現在値を優先しつつ、おすすめプールの中で重複回避
      const base=m.pool&&m.pool.length?m.pool:[m.t2,m.t3].filter(Boolean);
      slots.push(uniq([m.t2, ...base])); refs.push([ti,k,'t2']);
      slots.push(uniq([m.t3, ...base])); refs.push([ti,k,'t3']);
    }
  });
  if(!slots.length){toast('先に部隊または武将を選んでください。');return;}
  if(!sdrFeasible(slots)){toast('この構成では戦法の重複を完全には回避できません。組み合わせを見直してください。');return;}
  const res=sdrAssign(slots);
  refs.forEach(([ti,k,w],i)=>{if(res[i])board[ti].members[k][w]=res[i];});
  renderBoard();toast('戦法を重複なしで割り当てました。');
}
function narrow(){ if(mode!=='team'){toast('「部隊で選ぶ」モードで使えます。');return;} renderBoard(); toast('空き枠を、まだ組める部隊だけに絞りました。'); }
function copyBoard(){
  let out='【率土之滨 5部隊編成】\n';
  board.forEach((t,ti)=>{
    const filled=t.members.some(m=>m.gen);
    out+=`\n■ 部隊${ti+1}${t.name?'  '+dispName(t.name.replace(/^[＝≒]\s?/,'')):''}\n`;
    if(!filled){out+='  （未選択）\n';return;}
    t.members.forEach(m=>{if(!m.gen)return;out+=`  ${m.pos||''} ${m.gen}：${m.t2||'—'} / ${m.t3||'—'}\n`;});
  });
  navigator.clipboard.writeText(out).then(()=>toast('編成をコピーしました。'),()=>toast('コピーに失敗しました。'));
}

const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function bytesToB64u(bytes){let s='';for(let i=0;i<bytes.length;i+=3){const b0=bytes[i],b1=bytes[i+1]??0,b2=bytes[i+2]??0;
  s+=B64[b0>>2]+B64[((b0&3)<<4)|(b1>>4)]+(i+1<bytes.length?B64[((b1&15)<<2)|(b2>>6)]:'')+(i+2<bytes.length?B64[b2&63]:'');}return s;}
function b64uToBytes(s){const inv={};for(let i=0;i<B64.length;i++)inv[B64[i]]=i;const out=[];
  for(let i=0;i<s.length;i+=4){const c0=inv[s[i]],c1=inv[s[i+1]],c2=inv[s[i+2]],c3=inv[s[i+3]];
    out.push((c0<<2)|(c1>>4)); if(s[i+2]!==undefined)out.push(((c1&15)<<4)|(c2>>2)); if(s[i+3]!==undefined)out.push(((c2&3)<<6)|c3);}
  return out;}

/* board -> bytes: [mode][ per team: tmplIdx, (gen,t2,t3)x3 ] 255=空 */
function encodeBoard(){
  const gi=n=>{const i=ALL_GEN_NAMES.indexOf(n);return i<0?255:i;};
  const ti=n=>{const i=ALL_TACTICS.indexOf(n);return i<0?255:i;};
  const bytes=[mode==='gen'?1:0];
  board.forEach(bt=>{
    const tIdx = bt.name? TEAMS.findIndex(x=>x.name===bt.name) : 255;
    bytes.push(tIdx<0?255:tIdx);
    for(let k=0;k<3;k++){const m=bt.members[k]||{};bytes.push(m.gen?gi(m.gen):255);bytes.push(m.t2?ti(m.t2):255);bytes.push(m.t3?ti(m.t3):255);}
  });
  return bytesToB64u(bytes);
}
function decodeBoard(code){
  try{
    const b=b64uToBytes(code); let p=0;
    const md=b[p++]; mode = md===1?'gen':'team';
    const nb=[];
    for(let t=0;t<NUM;t++){
      const tIdx=b[p++];
      const team=blankTeam();
      if(tIdx!==255 && TEAMS[tIdx]) team.name=TEAMS[tIdx].name;
      for(let k=0;k<3;k++){
        const gi=b[p++],t2=b[p++],t3=b[p++];
        const m=blankMember();
        if(gi!==255 && ALL_GEN_NAMES[gi]){
          m.gen=ALL_GEN_NAMES[gi];
          const rep=repertoire(m.gen); m.pool=rep.pool;
          // team-mode candidates from template if present
          if(team.name){const tt=TEAMS[tIdx]; const mm=tt.members[k]; if(mm){m.candT2=mm.t2.slice();m.candT3=mm.t3.slice();m.treasure=mm.treasure||'';m.ciTiao=mm.ciTiao||'';}}
        }
        if(t2!==255 && ALL_TACTICS[t2]) m.t2=ALL_TACTICS[t2];
        if(t3!==255 && ALL_TACTICS[t3]) m.t3=ALL_TACTICS[t3];
        team.members[k]=m;
      }
      // 逆引き名（gen mode表示用）
      nb.push(team);
    }
    board=nb;
    // 逆引き名を更新
    board.forEach((t,ti)=>{ if(!t.name){t.name=reverseName(ti);} });
    return true;
  }catch(e){return false;}
}
function shareUrl(){return location.origin+location.pathname+'#d='+encodeBoard();}
function restoreFromHash(){
  const h=location.hash||''; const m=h.match(/[#&]d=([^&]+)/);
  if(m){ if(decodeBoard(m[1])){ setMode(mode); switchTab('board'); return true; } }
  return false;
}

    // members

/* ---------- 保存（PNG/JPG/PDF） ---------- */
async function saveImage(fmt){
  if(!board.some(t=>t.members.some(m=>m.gen))){toast('先に部隊を選んでください。');return;}
  await (document.fonts?document.fonts.ready:Promise.resolve());
  drawShareCard(async(cv)=>{
    const stamp=new Date().toISOString().slice(0,10);
    if(fmt==='pdf'){
      const jpg=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));
      const buf=new Uint8Array(await jpg.arrayBuffer());
      const pdf=jpegToPdf(buf,cv.width,cv.height);
      shareOrDownload(new Blob([pdf],{type:'application/pdf'}),'編成_'+stamp+'.pdf');
    }else{
      const type=fmt==='jpg'?'image/jpeg':'image/png';
      cv.toBlob(b=>shareOrDownload(b,'編成_'+stamp+'.'+fmt), type, 0.92);
    }
  });
}
function shareOrDownload(blob,name){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(()=>dl(blob,name));
  }else dl(blob,name);
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast('保存しました（'+name+'）');}

/* JPEG -> 1ページPDF（DCTDecode埋め込み、依存なし） */
function jpegToPdf(jpeg,w,h){
  const enc=s=>{const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&0xff;return a;};
  const parts=[]; let len=0; const off=[];
  const push=(x)=>{const a=typeof x==='string'?enc(x):x;parts.push(a);len+=a.length;};
  const obj=(s)=>{off.push(len);push(s);};
  push('%PDF-1.3\n');
  obj('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
  obj('2 0 obj\n<</Type/Pages/Kids[3 0 R]/Count 1>>\nendobj\n');
  obj('3 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+w+' '+h+']/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>\nendobj\n');
  off.push(len);push('4 0 obj\n<</Type/XObject/Subtype/Image/Width '+w+'/Height '+h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpeg.length+'>>\nstream\n');
  push(jpeg);push('\nendstream\nendobj\n');
  const cs='q '+w+' 0 0 '+h+' 0 0 cm /Im0 Do Q';
  obj('5 0 obj\n<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream\nendobj\n');
  const xrefStart=len;
  let xref='xref\n0 6\n0000000000 65535 f \n';
  for(let i=0;i<5;i++)xref+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  push(xref);
  push('trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n'+xrefStart+'\n%%EOF');
  const outb=new Uint8Array(len);let p=0;for(const a of parts){outb.set(a,p);p+=a.length;}
  return outb;
}

/* ---------- theme + ownership events ---------- */
document.getElementById('themeSwitch').addEventListener('change',e=>applyTheme(e.target.checked));

/* ---------- save / share events (in sticky summary bar) ---------- */
const saveMenu=document.getElementById('saveMenu');
document.getElementById('summary').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='save'){
    if(saveMenu.hidden){const r=b.getBoundingClientRect();saveMenu.style.left=Math.min(r.left,window.innerWidth-160)+'px';saveMenu.style.top=(r.bottom+6)+'px';saveMenu.hidden=false;}
    else saveMenu.hidden=true;
  }
  else if(act==='share')doShare();
  else if(act==='copy')copyBoard();
});
saveMenu.addEventListener('click',e=>{const b=e.target.closest('[data-fmt]');if(!b)return;saveMenu.hidden=true;saveImage(b.dataset.fmt);});
document.addEventListener('click',e=>{if(!saveMenu.hidden && !saveMenu.contains(e.target) && !e.target.closest('[data-act="save"]'))saveMenu.hidden=true;});
async function doShare(){
  const url=shareUrl();
  try{
    if(navigator.share){await navigator.share({title:'率土之滨 5部隊編成',url});}
    else{await navigator.clipboard.writeText(url);toast('共有リンクをコピーしました。');}
  }catch(e){try{await navigator.clipboard.writeText(url);toast('共有リンクをコピーしました。');}catch(_){toast('コピーできませんでした。');}}
}


const ownModal=document.getElementById('ownModal');
function renderOwnGrid(filter){
  const grid=document.getElementById('ownGrid');
  const q=(filter||'').trim();
  grid.innerHTML='';
  GEN_SORTED.forEach(g=>{
    if(q && !g.name.includes(q))return;
    const on=owned.has(g.name);
    const item=el(`<label class="own-item${on?' on':''}"><input type="checkbox" ${on?'checked':''}> ${esc(g.name)}</label>`);
    item.querySelector('input').addEventListener('change',e=>{
      if(e.target.checked)owned.add(g.name); else owned.delete(g.name);
      item.classList.toggle('on',e.target.checked);
      saveOwned();updOwnCount();renderTier();renderBoard();
    });
    grid.appendChild(item);
  });
}
document.getElementById('ownOpen').onclick=()=>{renderOwnGrid('');ownModal.classList.add('open');};
document.getElementById('ownClose').onclick=()=>ownModal.classList.remove('open');
ownModal.addEventListener('click',e=>{if(e.target===ownModal)ownModal.classList.remove('open');});
document.getElementById('ownSearch').addEventListener('input',e=>renderOwnGrid(e.target.value));
document.getElementById('ownAll').onclick=()=>{owned=new Set(ALL_GEN_NAMES);saveOwned();updOwnCount();renderOwnGrid(document.getElementById('ownSearch').value);renderTier();renderBoard();};
document.getElementById('ownNone').onclick=()=>{owned=new Set();saveOwned();updOwnCount();renderOwnGrid(document.getElementById('ownSearch').value);renderTier();renderBoard();};
document.getElementById('ownFilter').addEventListener('change',e=>{ownFilterOn=e.target.checked;store.set('stzb_ownfilter',ownFilterOn);renderTier();});

applyTheme(store.get('stzb_dark',false));
