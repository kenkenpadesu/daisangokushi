<style>
:root{--ink:#17130d;--ink2:#1e1810;--panel:#241d14;--panel2:#2c2318;--line:#3b3125;--line2:#4a3d2c;
--gold:#d6b25c;--gold-dim:#9f8340;--gold-soft:#e7cd8a;--paper:#ece2cd;--muted:#a8997c;
--jade:#79c39a;--jade-dim:#3c6b52;--verm:#dd6e5a;--verm-dim:#7a3a30;}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 500px at 50% -8%,#2a2015 0%,rgba(42,32,21,0) 60%),linear-gradient(180deg,#17130d,#141009);
color:var(--paper);font-family:"Noto Sans JP",system-ui,sans-serif;min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 13px 70px}
.masthead{padding:26px 4px 16px;border-bottom:1px solid var(--line);position:relative}
.masthead::after{content:"";position:absolute;left:0;bottom:-1px;width:82px;height:2px;background:var(--gold)}
.kicker{font-size:11.5px;letter-spacing:.4em;color:var(--gold-dim);font-weight:700;text-indent:.4em}
.title{font-family:"Noto Serif JP",serif;font-weight:900;color:var(--gold-soft);font-size:clamp(26px,6.4vw,44px);
letter-spacing:.05em;line-height:1.08;margin-top:5px;text-shadow:0 1px 0 #000,0 0 22px rgba(214,178,92,.14)}
.subtitle{color:var(--muted);font-size:13px;margin-top:7px}.subtitle b{color:var(--paper);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0 4px}
.tablet{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:3px;padding:10px 12px;position:relative;overflow:hidden}
.tablet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold-dim)}
.tablet.new::before{background:var(--jade-dim)}.tablet.left::before{background:var(--verm-dim)}
.tablet .k{font-size:10.5px;color:var(--muted);letter-spacing:.1em;font-weight:700}
.tablet .v{font-family:"Noto Serif JP",serif;font-weight:700;font-size:clamp(20px,5vw,27px);color:var(--paper);font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.05}
.tablet.new .v{color:var(--jade)}.tablet.left .v{color:var(--verm)}
.tablet .s{font-size:10.5px;color:var(--muted);margin-top:2px}
.controls{position:sticky;top:0;z-index:40;padding:11px 0 10px;background:linear-gradient(180deg,#161009 82%,rgba(22,16,9,0))}
.seg{display:flex;background:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:3px;gap:2px;overflow-x:auto}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:3px;white-space:nowrap}
.seg button.on{background:linear-gradient(180deg,#3a2f1d,#2c2318);color:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--line2)}
.row2{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:9px}
.search{flex:1 1 190px;min-width:140px;position:relative}
.search input{width:100%;background:var(--ink2);border:1px solid var(--line);border-radius:4px;color:var(--paper);font-family:inherit;font-size:15px;padding:9px 32px 9px 12px;outline:none}
.search input:focus{border-color:var(--gold-dim);box-shadow:0 0 0 2px rgba(214,178,92,.12)}
.search input::placeholder{color:#7c715c}
.search .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:18px;line-height:1;display:none;padding:2px}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.1em;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--ink2);color:var(--muted);font-family:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--gold-dim);color:var(--gold-soft);background:#2b2216}
.count{font-size:12px;color:var(--muted);margin:11px 2px 8px}.count b{color:var(--gold-soft);font-weight:700}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:5px;background:var(--ink2);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content}
thead th{position:sticky;top:0;z-index:20;background:#221a11;color:var(--gold-dim);font-size:10.5px;font-weight:700;text-align:right;white-space:nowrap;padding:10px 11px;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;line-height:1.25}
thead th .ar{color:var(--gold);font-size:9px;margin-left:2px;opacity:0}thead th.sorted .ar{opacity:1}
.c-status{width:64px}.c-squad{width:78px}.c-num{width:94px}.c-delta{width:102px}
th.name,td.name{text-align:left;position:sticky;left:0;z-index:10;background:var(--ink2);border-right:1px solid var(--line);width:132px;min-width:132px;max-width:132px}
thead th.name{z-index:30;background:#221a11}
tbody td{padding:9px 11px;text-align:right;font-size:13px;border-bottom:1px solid #241d13;font-variant-numeric:tabular-nums}
tbody td.name{white-space:normal;word-break:break-word}tbody td:not(.name){white-space:nowrap}
tbody tr:hover td{background:#211a11}tbody tr:hover td.name{background:#241d12}
tbody tr.hit td{background:#332612 !important}tbody tr.hit td.name{background:#3a2c15 !important}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:19px;font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;border:1px solid var(--line2);border-radius:3px;padding:0 4px;margin-right:7px;vertical-align:middle}
.rk.m1{color:#1c1608;background:linear-gradient(180deg,#e7cd8a,#c69f45);border-color:#c69f45}
.rk.m2{color:#17130d;background:linear-gradient(180deg,#d7d7dc,#a9a9b2);border-color:#a9a9b2}
.rk.m3{color:#17130d;background:linear-gradient(180deg,#d6a677,#b07b48);border-color:#b07b48}
.rk.na{color:#6f6450}
.nm{font-weight:500;color:var(--paper);font-size:13px;vertical-align:middle}
.sq{font-size:11.5px;color:var(--gold-dim);font-weight:700}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.badge.n{color:var(--jade);border-color:var(--jade-dim);background:rgba(121,195,154,.08)}
.badge.l{color:var(--verm);border-color:var(--verm-dim);background:rgba(221,110,90,.08)}
.delta{font-weight:700;display:inline-block}.delta.up{color:var(--jade)}.delta.dn{color:var(--verm)}.delta.ze{color:#6f6450}
.delta .bar{display:block;height:2px;margin-top:4px;border-radius:2px;margin-left:auto;opacity:.5}
.delta.up .bar{background:var(--jade)}.delta.dn .bar{background:var(--verm)}
.dim{color:#7d715b}
.sqname{font-weight:700;color:var(--gold-soft);font-size:13.5px}
.note{font-size:12px;color:var(--muted);margin:15px 2px 0;padding:11px 13px;border:1px solid var(--line);border-left:3px solid var(--gold-dim);border-radius:3px;background:var(--panel);line-height:1.55}
.note b{color:var(--gold-soft);font-weight:700}
.foot{margin-top:20px;padding-top:13px;border-top:1px solid var(--line);color:#6f6450;font-size:11px;text-align:center}
.empty{padding:38px 16px;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:560px){.wrap{padding:0 10px 60px}.stats{gap:7px}.tablet{padding:9px 10px}
.c-num{width:84px}.c-delta{width:94px}.c-status{width:56px}.c-squad{width:62px}
th.name,td.name{width:112px;min-width:112px;max-width:112px}
tbody td,thead th{padding:8px 8px;font-size:12.5px}.nm,.rk{font-size:12px}}
</style>
</head>

const rankPill=r=>{if(r==null)return '<span class="rk na">–</span>';const c=r===1?'m1':r===2?'m2':r===3?'m3':'';return '<span class="rk '+c+'">'+r+'</span>'};
const maxAbs=(rows,key)=>Math.max(1,...rows.map(r=>Math.abs(r[key]||0)));
function deltaCell(v,max){if(v==null)return '<td class="c-delta dim">—</td>';const cls=v>0?'up':v<0?'dn':'ze',ar=v>0?'▲':v<0?'▼':'',sign=v>0?'+':'';const w=Math.min(100,Math.abs(v)/max*100);const bar=v!==0?'<span class="bar" style="width:'+w+'%"></span>':'';return '<td class="c-delta"><span class="delta '+cls+'">'+ar+' '+sign+v.toLocaleString('ja-JP')+bar+'</span></td>'}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function squadAgg(){const agg={};SQUAD_ORDER.forEach(s=>agg[s]={squad:s,n:0,sb:0,ss:0});
  latest.data.forEach(r=>{const s=SQUADS[r.name];if(!agg[s])return;agg[s].n++;agg[s].sb+=r.b;agg[s].ss+=r.s});
  return SQUAD_ORDER.map(s=>{const a=agg[s];return{squad:s,n:a.n,sb:a.sb,ab:a.n?Math.round(a.sb/a.n):0,ss:a.ss,as:a.n?Math.round(a.ss/a.n):0}})}

const weekViews=[...WEEKS].reverse();
let view='trend', squadFilter='all';
const trendSorts=[{label:'ランキング',key:'bL',dir:-1},{label:'勢力値の伸び',key:'ds',dir:-1},{label:'武勲の伸び',key:'db',dir:-1},{label:'勢力値',key:'sL',dir:-1}];
const weekSorts=[{label:'武勲',key:'b',dir:-1},{label:'勢力値',key:'s',dir:-1}];
const squadSorts=[{label:'合計勢力値',key:'ss',dir:-1},{label:'合計武勲',key:'sb',dir:-1},{label:'平均勢力値',key:'as',dir:-1},{label:'平均武勲',key:'ab',dir:-1},{label:'人数',key:'n',dir:-1}];
let sortKey='bL',sortDir=-1;
const isTrend=()=>view==='trend', isSquad=()=>view==='squad';
const activeWeek=()=>weekViews.find(w=>w.label===view);
const sortsFor=()=>isSquad()?squadSorts:(isTrend()?trendSorts:weekSorts);

function colsFor(){
  if(isSquad())return[{h:'分隊',cls:'name'},{h:'人数',k:'n',cls:'c-num'},{h:'合計武勲',k:'sb',cls:'c-num'},{h:'平均武勲',k:'ab',cls:'c-num'},{h:'合計勢力値',k:'ss',cls:'c-num'},{h:'平均勢力値',k:'as',cls:'c-num'}];
  if(isTrend())return[{h:'メンバー',cls:'name'},{h:'分隊',cls:'c-squad'},{h:'状態',cls:'c-status'},{h:'武勲 '+latest.label,k:'bL',cls:'c-num'},{h:'武勲 増減',k:'db',cls:'c-delta'},{h:'勢力値 '+latest.label,k:'sL',cls:'c-num'},{h:'勢力値 増減',k:'ds',cls:'c-delta'},{h:'武勲 '+prev.label,k:'bP',cls:'c-num dim'},{h:'勢力値 '+prev.label,k:'sP',cls:'c-num dim'}];
  return[{h:'メンバー',cls:'name'},{h:'分隊',cls:'c-squad'},{h:'武勲',k:'b',cls:'c-num'},{h:'勢力値',k:'s',cls:'c-num'}];
}
function currentRows(){
  if(isSquad())return squadAgg();
  let rows=isTrend()?merged.slice():activeWeek().data.map(r=>({...r,squad:SQUADS[r.name]||''}));
  return rows;
}
function buildSeg(){
  const b=['<button data-v="trend" class="'+(view==='trend'?'on':'')+'">推移</button>','<button data-v="squad" class="'+(view==='squad'?'on':'')+'">分隊</button>']
   .concat(weekViews.map(w=>'<button data-v="'+w.label+'" class="'+(view===w.label?'on':'')+'">'+w.label+'</button>'));
  document.getElementById('seg').innerHTML=b.join('');
}
function buildChips(){document.getElementById('chips').innerHTML=sortsFor().map(o=>'<button class="chip'+(o.key===sortKey?' on':'')+'" data-k="'+o.key+'" data-d="'+o.dir+'">'+o.label+'</button>').join('')}
function buildSqFilter(){
  document.getElementById('sqrow').style.display=isSquad()?'none':'flex';
  const chips=['<button class="chip'+(squadFilter==='all'?' on':'')+'" data-s="all">全体</button>']
   .concat(SQUAD_ORDER.map(s=>'<button class="chip'+(squadFilter===s?' on':'')+'" data-s="'+s+'">'+s+'</button>'));
  document.getElementById('sqfilter').innerHTML=chips.join('');
}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const cols=colsFor(),tbl=document.getElementById('tbl');
  tbl.className=isSquad()?'squad':(isTrend()?'trend':'week');
  document.getElementById('thead').innerHTML='<tr>'+cols.map(c=>{const sorted=c.k&&c.k===sortKey,ar=sorted?(sortDir<0?'▼':'▲'):'';return '<th class="'+(c.cls||'')+(sorted?' sorted':'')+'" data-k="'+(c.k||'')+'">'+c.h+'<span class="ar">'+ar+'</span></th>'}).join('')+'</tr>';
  let rows=currentRows();
  if(sortKey)rows.sort((a,b)=>{let av=a[sortKey],bv=b[sortKey];if(typeof av==='string'||typeof bv==='string')return String(av).localeCompare(String(bv),'ja')*sortDir;av=av==null?-Infinity:av;bv=bv==null?-Infinity:bv;return(av-bv)*sortDir});
  if(!isSquad()&&squadFilter!=='all')rows=rows.filter(r=>r.squad===squadFilter);
  const filtered=q?rows.filter(r=>(r.name||'').toLowerCase().includes(q)):rows;
  const maxDb=isTrend()?maxAbs(merged,'db'):1,maxDs=isTrend()?maxAbs(merged,'ds'):1;
  const tb=document.getElementById('tbody');
  if(!filtered.length){tb.innerHTML='<tr><td class="empty" colspan="'+cols.length+'">該当するデータがありません</td></tr>';setCount(0,rows.length,q);return}
  tb.innerHTML=filtered.map(r=>{
    if(isSquad()){return '<tr><td class="name"><span class="sqname">'+esc(r.squad)+'</span></td><td class="c-num">'+fmt(r.n)+'</td><td class="c-num">'+fmt(r.sb)+'</td><td class="c-num">'+fmt(r.ab)+'</td><td class="c-num">'+fmt(r.ss)+'</td><td class="c-num">'+fmt(r.as)+'</td></tr>'}
    const hit=q&&r.name.toLowerCase().includes(q);
    if(isTrend()){const badge=r.status==='新加入'?'<span class="badge n">新加入</span>':r.status==='脱退'?'<span class="badge l">脱退</span>':'<span class="badge">継続</span>';
      return '<tr class="'+(hit?'hit':'')+'"><td class="name">'+rankPill(r.rank)+'<span class="nm">'+esc(r.name)+'</span></td><td class="c-squad"><span class="sq">'+esc(r.squad)+'</span></td><td class="c-status">'+badge+'</td><td class="c-num">'+fmt(r.bL)+'</td>'+deltaCell(r.db,maxDb)+'<td class="c-num">'+fmt(r.sL)+'</td>'+deltaCell(r.ds,maxDs)+'<td class="c-num dim">'+fmt(r.bP)+'</td><td class="c-num dim">'+fmt(r.sP)+'</td></tr>'}
    return '<tr class="'+(hit?'hit':'')+'"><td class="name"><span class="nm">'+esc(r.name)+'</span></td><td class="c-squad"><span class="sq">'+esc(r.squad)+'</span></td><td class="c-num">'+fmt(r.b)+'</td><td class="c-num">'+fmt(r.s)+'</td></tr>';
  }).join('');
  setCount(filtered.length,rows.length,q);
}
function setCount(shown,total,q){const el=document.getElementById('count');
  if(isSquad()){el.innerHTML='<b>'+SQUAD_ORDER.length+'</b> 分隊 ・ 全'+latest.data.length+'名（'+latest.label+'）';return}
  const suff=squadFilter!=='all'?'（'+squadFilter+'）':'';
  el.innerHTML=q?'「'+esc(q)+'」で <b>'+shown+'</b> 件'+suff:'<b>'+shown+'</b> 名を表示'+suff;
}
document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;const def=sortsFor()[0];sortKey=def.key;sortDir=def.dir;buildSeg();buildChips();buildSqFilter();render()});
document.getElementById('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.k;if(k===sortKey)sortDir*=-1;else{sortKey=k;sortDir=parseInt(c.dataset.d)}buildChips();render()});
document.getElementById('sqfilter').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;squadFilter=c.dataset.s;buildSqFilter();render()});
document.getElementById('thead').addEventListener('click',e=>{const th=e.target.closest('th');if(!th||!th.dataset.k)return;const k=th.dataset.k;if(k===sortKey)sortDir*=-1;else{sortKey=k;sortDir=-1}buildChips();render()});
const q=document.getElementById('q'),qx=document.getElementById('qx');
q.addEventListener('input',()=>{qx.style.display=q.value?'block':'none';render()});
qx.addEventListener('click',()=>{q.value='';qx.style.display='none';render();q.focus()});
buildSeg();buildChips();buildSqFilter();render();
</script>
</body>
</html>
