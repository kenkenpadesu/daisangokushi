<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同盟 武勲記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17130d; --ink2:#1e1810; --panel:#241d14; --panel2:#2c2318;
  --line:#3b3125; --line2:#4a3d2c;
  --gold:#d6b25c; --gold-dim:#9f8340; --gold-soft:#e7cd8a;
  --paper:#ece2cd; --muted:#a8997c;
  --jade:#79c39a; --jade-dim:#3c6b52;
  --verm:#dd6e5a; --verm-dim:#7a3a30;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1200px 500px at 50% -8%, #2a2015 0%, rgba(42,32,21,0) 60%),
    linear-gradient(180deg,#17130d 0%, #141009 100%);
  color:var(--paper); font-family:"Noto Sans JP",system-ui,sans-serif;
  min-height:100vh; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding:0 14px 80px}

/* header */
.masthead{padding:30px 4px 18px; border-bottom:1px solid var(--line); position:relative}
.masthead::after{content:""; position:absolute; left:0; bottom:-1px; width:88px; height:2px; background:var(--gold)}
.kicker{font-size:12px; letter-spacing:.42em; color:var(--gold-dim); font-weight:700; text-indent:.42em}
.title{font-family:"Noto Serif JP",serif; font-weight:900; color:var(--gold-soft);
  font-size:clamp(28px,7vw,46px); letter-spacing:.06em; line-height:1.08; margin-top:6px;
  text-shadow:0 1px 0 #000, 0 0 22px rgba(214,178,92,.14)}
.subtitle{color:var(--muted); font-size:13.5px; margin-top:8px; letter-spacing:.02em}
.subtitle b{color:var(--paper); font-weight:500}

/* stat tablets */
.stats{display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 4px}
.tablet{flex:1 1 120px; background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line); border-radius:3px; padding:11px 13px; position:relative; overflow:hidden}
.tablet::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--gold-dim)}
.tablet.new::before{background:var(--jade-dim)}
.tablet.left::before{background:var(--verm-dim)}
.tablet .k{font-size:11px; color:var(--muted); letter-spacing:.14em; font-weight:700}
.tablet .v{font-family:"Noto Serif JP",serif; font-weight:700; font-size:26px; color:var(--paper);
  font-variant-numeric:tabular-nums; margin-top:1px}
.tablet.new .v{color:var(--jade)} .tablet.left .v{color:var(--verm)}
.tablet .s{font-size:11px; color:var(--muted)}

/* controls */
.controls{position:sticky; top:0; z-index:40; padding:12px 0 11px;
  background:linear-gradient(180deg,#161009 78%, rgba(22,16,9,0)); }
.seg{display:inline-flex; background:var(--ink2); border:1px solid var(--line); border-radius:4px; padding:3px; gap:2px}
.seg button{appearance:none; border:0; background:transparent; color:var(--muted); cursor:pointer;
  font-family:inherit; font-size:12.5px; font-weight:700; letter-spacing:.03em; padding:7px 12px; border-radius:3px; white-space:nowrap}
.seg button.on{background:linear-gradient(180deg,#3a2f1d,#2c2318); color:var(--gold-soft); box-shadow:inset 0 0 0 1px var(--line2)}
.row2{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-top:10px}
.search{flex:1 1 200px; min-width:150px; position:relative}
.search input{width:100%; background:var(--ink2); border:1px solid var(--line); border-radius:4px;
  color:var(--paper); font-family:inherit; font-size:14px; padding:9px 32px 9px 12px; outline:none}
.search input:focus{border-color:var(--gold-dim); box-shadow:0 0 0 2px rgba(214,178,92,.12)}
.search input::placeholder{color:#7c715c}
.search .x{position:absolute; right:8px; top:50%; transform:translateY(-50%); color:var(--muted);
  cursor:pointer; font-size:18px; line-height:1; display:none; padding:2px}
.sortlbl{font-size:11px; color:var(--muted); letter-spacing:.12em; font-weight:700; margin-right:-3px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{appearance:none; border:1px solid var(--line); background:var(--ink2); color:var(--muted);
  font-family:inherit; font-size:12px; font-weight:700; padding:6px 11px; border-radius:20px; cursor:pointer}
.chip.on{border-color:var(--gold-dim); color:var(--gold-soft); background:#2b2216}

.count{font-size:12px; color:var(--muted); margin:12px 2px 8px}
.count b{color:var(--gold-soft); font-weight:700}

/* table */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:5px; background:var(--ink2);
  -webkit-overflow-scrolling:touch}
table{border-collapse:separate; border-spacing:0; width:100%; min-width:640px}
thead th{position:sticky; top:0; z-index:20; background:#221a11; color:var(--gold-dim);
  font-size:11px; font-weight:700; letter-spacing:.06em; text-align:right; white-space:nowrap;
  padding:11px 12px; border-bottom:1px solid var(--line2); cursor:pointer; user-select:none}
thead th .ar{color:var(--gold); font-size:9px; margin-left:3px; opacity:0}
thead th.sorted .ar{opacity:1}
th.name, td.name{text-align:left; position:sticky; left:0; z-index:10; background:var(--ink2);
  border-right:1px solid var(--line); min-width:158px; max-width:200px}
thead th.name{z-index:30; background:#221a11}
tbody td{padding:10px 12px; text-align:right; font-size:13.5px; border-bottom:1px solid #241d13;
  font-variant-numeric:tabular-nums; white-space:nowrap}
tbody tr:hover td{background:#211a11}
tbody tr:hover td.name{background:#241d12}
tbody tr.hit td{background:#332612 !important}
tbody tr.hit td.name{background:#3a2c15 !important}

.rk{display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:20px;
  font-size:11px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums;
  border:1px solid var(--line2); border-radius:3px; padding:0 5px; margin-right:8px; vertical-align:middle}
.rk.m1{color:#1c1608; background:linear-gradient(180deg,#e7cd8a,#c69f45); border-color:#c69f45}
.rk.m2{color:#17130d; background:linear-gradient(180deg,#d7d7dc,#a9a9b2); border-color:#a9a9b2}
.rk.m3{color:#17130d; background:linear-gradient(180deg,#d6a677,#b07b48); border-color:#b07b48}
.rk.na{color:#6f6450}
.nm{font-weight:500; color:var(--paper); font-size:13.5px; vertical-align:middle}

.badge{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.04em;
  padding:2px 8px; border-radius:20px; border:1px solid var(--line2); color:var(--muted)}
.badge.n{color:var(--jade); border-color:var(--jade-dim); background:rgba(121,195,154,.08)}
.badge.l{color:var(--verm); border-color:var(--verm-dim); background:rgba(221,110,90,.08)}

.delta{font-weight:700}
.delta.up{color:var(--jade)} .delta.dn{color:var(--verm)} .delta.ze{color:#6f6450}
.delta .bar{display:block; height:2px; margin-top:4px; border-radius:2px; margin-left:auto; opacity:.55}
.delta.up .bar{background:var(--jade)} .delta.dn .bar{background:var(--verm)}
.dim{color:#6f6450}

.note{font-size:12px; color:var(--muted); margin:16px 2px 0; padding:12px 14px;
  border:1px solid var(--line); border-left:3px solid var(--gold-dim); border-radius:3px; background:var(--panel)}
.note b{color:var(--gold-soft); font-weight:700}
.foot{margin-top:22px; padding-top:14px; border-top:1px solid var(--line); color:#6f6450; font-size:11.5px; text-align:center; letter-spacing:.04em}

.empty{padding:40px 16px; text-align:center; color:var(--muted); font-size:14px}

@media(max-width:560px){
  .wrap{padding:0 10px 70px}
  .tablet{flex:1 1 calc(50% - 5px)}
  tbody td, thead th{padding:9px 9px; font-size:13px}
  th.name,td.name{min-width:140px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="kicker">同盟成員 ・ 武勲記録</div>

  <div class="controls">

  <div class="count" id="count"></div>
  <div class="tw"><table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>

</div>

const W1 = DATA.w1.map(r=>({name:r[0], b:r[1], s:r[2]}));
const W2 = DATA.w2.map(r=>({name:r[0], b:r[1], s:r[2]}));
const m1=new Map(W1.map(r=>[r.name,r])), m2=new Map(W2.map(r=>[r.name,r]));

// merged trend rows
const names=new Set([...m1.keys(),...m2.keys()]);
let merged=[...names].map(n=>{
  const a=m1.get(n), b=m2.get(n);
  let st = (a&&b)?'継続':(b?'新加入':'脱退');
  return {name:n, status:st,
    b1:a?a.b:null, b2:b?b.b:null, db:(a&&b)?b.b-a.b:null,
    s1:a?a.s:null, s2:b?b.s:null, ds:(a&&b)?b.s-a.s:null};
});
// rank by 先週武勲 (脱退 last)
merged.sort((x,y)=>(y.b2??-1)-(x.b2??-1));
merged.forEach((r,i)=>r.rank = r.b2!=null ? i+1 : null);

const nNew=merged.filter(r=>r.status==='新加入').length;
const nLeft=merged.filter(r=>r.status==='脱退').length;
const nCont=merged.filter(r=>r.status==='継続').length;
const upS=merged.filter(r=>r.ds>0).length;

document.getElementById('sub').innerHTML =
  '先々週 <b>8/10–16</b> と 先週 <b>8/17–23</b> の比較 ・ 全<b>'+names.size+'</b>名';

const stats=[
  {k:'先週の在籍', v:W2.length, s:'8/17-23 時点', c:''},
  {k:'継続', v:nCont, s:'両週とも在籍', c:''},
  {k:'新加入', v:nNew, s:'先週から参加', c:'new'},
  {k:'脱退', v:nLeft, s:'先週で離脱', c:'left'},
  {k:'勢力値プラス', v:upS+'名', s:'継続'+nCont+'名中', c:''},
];
document.getElementById('stats').innerHTML = stats.map(t=>
  '<div class="tablet '+t.c+'"><div class="k">'+t.k+'</div><div class="v">'+
  (typeof t.v==='number'?t.v.toLocaleString('ja-JP'):t.v)+'</div><div class="s">'+t.s+'</div></div>').join('');

const fmt=n=> n==null?'—':n.toLocaleString('ja-JP');
const rankPill=(r,st)=>{
  if(r==null) return '<span class="rk na">–</span>';
  let c = r===1?'m1':r===2?'m2':r===3?'m3':'';
  return '<span class="rk '+c+'">'+r+'</span>';
};
const maxAbs=(rows,key)=>Math.max(1,...rows.map(r=>Math.abs(r[key]||0)));
function deltaCell(v, max){
  if(v==null) return '<td class="dim">—</td>';
  const cls = v>0?'up':v<0?'dn':'ze';
  const ar = v>0?'▲':v<0?'▼':'';
  const w = Math.min(100, Math.abs(v)/max*100);
  const bar = v!==0 ? '<span class="bar" style="width:'+w+'%"></span>' : '';
  const sign = v>0?'+':'';
  return '<td><span class="delta '+cls+'">'+ar+' '+sign+v.toLocaleString('ja-JP')+bar+'</span></td>';
}

// view + sort state
let view='trend';
const sortsByView={
  trend:[
    {id:'rank', label:'ランキング', key:'b2', dir:-1},
    {id:'ds', label:'勢力値の伸び', key:'ds', dir:-1},
    {id:'db', label:'武勲の伸び', key:'db', dir:-1},
    {id:'s2', label:'勢力値', key:'s2', dir:-1},
  ],
  w2:[{id:'b',label:'武勲',key:'b',dir:-1},{id:'s',label:'勢力値',key:'s',dir:-1}],
  w1:[{id:'b',label:'武勲',key:'b',dir:-1},{id:'s',label:'勢力値',key:'s',dir:-1}],
};
let sortKey='b2', sortDir=-1;

function colsFor(v){
  if(v==='trend') return [
    {h:'メンバー',cls:'name'},{h:'状態',k:null},
    {h:'武勲 先週',k:'b2'},{h:'武勲 増減',k:'db'},
    {h:'勢力値 先週',k:'s2'},{h:'勢力値 増減',k:'ds'},
    {h:'武勲 先々週',k:'b1'},{h:'勢力値 先々週',k:'s1'},
  ];
  return [{h:'メンバー',cls:'name'},{h:'武勲',k:'b'},{h:'勢力値',k:'s'}];
}

function currentRows(){
  if(view==='trend') return merged.slice();
  const src = view==='w2'?W2:W1;
  const rows = src.map((r,i)=>({...r}));
  return rows;
}

function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const cols=colsFor(view);
  // header
  document.getElementById('thead').innerHTML='<tr>'+cols.map(c=>{
    const sorted = c.k && c.k===sortKey;
    const ar = sorted ? (sortDir<0?'▼':'▲') : '';
    return '<th class="'+(c.cls||'')+(sorted?' sorted':'')+'" data-k="'+(c.k||'')+'">'+
      c.h+'<span class="ar">'+ar+'</span></th>';
  }).join('')+'</tr>';

  let rows=currentRows();
  // sort
  if(sortKey){
    rows.sort((a,b)=>{
      let av=a[sortKey], bv=b[sortKey];
      av=(av==null)?-Infinity:av; bv=(bv==null)?-Infinity:bv;
      return (av-bv)*sortDir;
    });
  }
  const filtered = q ? rows.filter(r=>r.name.toLowerCase().includes(q)) : rows;

  const maxDb = view==='trend'?maxAbs(merged,'db'):1;
  const maxDs = view==='trend'?maxAbs(merged,'ds'):1;

  const tb=document.getElementById('tbody');
  if(!filtered.length){ tb.innerHTML='<tr><td class="empty" colspan="'+cols.length+'">「'+q+'」に一致するメンバーはいません</td></tr>'; updateCount(0,rows.length,q); return; }

  tb.innerHTML=filtered.map(r=>{
    const hit = q && r.name.toLowerCase().includes(q);
    if(view==='trend'){
      const badge = r.status==='新加入'?'<span class="badge n">新加入</span>'
        : r.status==='脱退'?'<span class="badge l">脱退</span>'
        : '<span class="badge">継続</span>';
      return '<tr class="'+(hit?'hit':'')+'">'
        +'<td class="name">'+rankPill(r.rank,r.status)+'<span class="nm">'+esc(r.name)+'</span></td>'
        +'<td>'+badge+'</td>'
        +'<td>'+fmt(r.b2)+'</td>'
        + deltaCell(r.db, maxDb)
        +'<td>'+fmt(r.s2)+'</td>'
        + deltaCell(r.ds, maxDs)
        +'<td class="dim">'+fmt(r.b1)+'</td>'
        +'<td class="dim">'+fmt(r.s1)+'</td>'
        +'</tr>';
    } else {
      return '<tr class="'+(hit?'hit':'')+'">'
        +'<td class="name"><span class="nm">'+esc(r.name)+'</span></td>'
        +'<td>'+fmt(r.b)+'</td>'
        +'<td>'+fmt(r.s)+'</td></tr>';
    }
  }).join('');
  updateCount(filtered.length, rows.length, q);
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function updateCount(shown,total,q){
  document.getElementById('count').innerHTML = q
    ? '「'+esc(q)+'」で <b>'+shown+'</b> 件表示（全'+total+'名）'
    : '<b>'+total+'</b> 名を表示';
}

function buildChips(){
  const list=sortsByView[view];
  document.getElementById('chips').innerHTML=list.map(o=>
    '<button class="chip'+(o.key===sortKey?' on':'')+'" data-k="'+o.key+'" data-d="'+o.dir+'">'+o.label+'</button>').join('');
}

// events
document.getElementById('seg').addEventListener('click',e=>{
  const btn=e.target.closest('button'); if(!btn) return;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===btn));
  view=btn.dataset.v;
  const def=sortsByView[view][0]; sortKey=def.key; sortDir=def.dir;
  buildChips(); render();
});
document.getElementById('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  const k=c.dataset.k;
  if(k===sortKey){ sortDir*=-1; } else { sortKey=k; sortDir=parseInt(c.dataset.d); }
  buildChips(); render();
});
document.getElementById('thead').addEventListener('click',e=>{
  const th=e.target.closest('th'); if(!th||!th.dataset.k) return;
  const k=th.dataset.k;
  if(k===sortKey){ sortDir*=-1; } else { sortKey=k; sortDir=-1; }
  buildChips(); render();
});
const q=document.getElementById('q'), qx=document.getElementById('qx');
q.addEventListener('input',()=>{ qx.style.display=q.value?'block':'none'; render(); });
qx.addEventListener('click',()=>{ q.value=''; qx.style.display='none'; render(); q.focus(); });

buildChips(); render();
</script>
